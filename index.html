function v2Find(n, id){
  if(n.t==="stack") return n.tabs.includes(id) ? n : null;
  if(n.t==="split") for(const k of n.kids){ const f = v2Find(k,id); if(f) return f; }
  return null;
}
function v2First(n){
  if(n.t==="stack") return n;
  if(n.t==="split") for(const k of n.kids){ const f = v2First(k); if(f) return f; }
  return null;
}
/* Fenster aus dem Baum nehmen; leere Stapel und Splits mit nur einem Kind fallen weg */
function v2Remove(n, id){
  if(n.t==="stack"){
    const i = n.tabs.indexOf(id);
    if(i<0) return n;
    n.tabs.splice(i,1);
    if(n.active===id) n.active = n.tabs[0] || null;
    return n.tabs.length ? n : null;
  }
  if(n.t==="split"){
    n.kids = n.kids.map(k=>v2Remove(k,id)).filter(Boolean);
    if(!n.kids.length) return null;
    return n.kids.length===1 ? n.kids[0] : n;
  }
  return n;
}
/* Ziel-Leaf durch einen Split ersetzen: Rand links/oben setzt das neue Fenster davor, sonst danach */
function v2Wrap(n, leaf, ns, pos){
  if(n===leaf){
    const dir = (pos==="left" || pos==="right") ? "h" : "v";
    return {t:"split", dir, kids: (pos==="left" || pos==="top") ? [ns, leaf] : [leaf, ns]};
  }
  if(n.t==="split") n.kids = n.kids.map(k=>v2Wrap(k, leaf, ns, pos));
  return n;
}
function v2Move(id, leaf, pos){
  const src = v2Find(state.v2, id);
  if(src===leaf && (pos==="center" || src.tabs.length===1)) return;
  const root = v2Remove(state.v2, id);
  if(pos==="center"){
    leaf.tabs.push(id); leaf.active = id;
    state.v2 = root;
  } else {
    state.v2 = v2Wrap(root, leaf, {t:"stack", tabs:[id], active:id}, pos);
  }
}
function v2Open(id){
  v2Root();
  const st = v2Find(state.v2, id);
  if(st){ st.active = id; return; }
  const f = v2First(state.v2);
  if(f){ f.tabs.push(id); f.active = id; }
  else state.v2 = {t:"split", dir:"h", kids:[state.v2, {t:"stack", tabs:[id], active:id}]};
}
/* Flow- und Navigationsschritte öffnen das passende Fenster */
function v2Focus(screen){
  const w = V2MAP[screen];
  if(!w) return;
  if(screen==="neu-shortcuts") state.helpView = "shortcuts";
  v2Open(w);
}

/* Zielzone unter dem Zeiger: Rand (25 %) teilt, Mitte stapelt, Canvas nimmt keine Mitte */
function v2Pick(x, y){
  let best = null;
  document.querySelectorAll(".v2root [data-leaf]").forEach(l=>{
    const r = l.getBoundingClientRect();
    if(x<r.left || x>r.right || y<r.top || y>r.bottom) return;
    const rx = (x-r.left)/r.width, ry = (y-r.top)/r.height;
    let pos = "center";
    if(ry<0.25) pos = "top"; else if(ry>0.75) pos = "bottom";
    else if(rx<0.25) pos = "left"; else if(rx>0.75) pos = "right";
    if(l._node.t==="canvas" && pos==="center") return;
    const hl = {
      top:[r.left, r.top, r.width, r.height*0.25],
      bottom:[r.left, r.bottom-r.height*0.25, r.width, r.height*0.25],
      left:[r.left, r.top, r.width*0.25, r.height],
      right:[r.right-r.width*0.25, r.top, r.width*0.25, r.height],
      center:[r.left+r.width*0.25, r.top+r.height*0.25, r.width*0.5, r.height*0.5]}[pos];
    best = {node:l._node, pos, r:{left:hl[0], top:hl[1], width:hl[2], height:hl[3]}};
  });
  return best;
}
let v2Dragged = false;
function v2Drag(e, id){
  if(e.button!==0) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY;
  let moved = false, hit = null, hl = null;
  const mv = ev=>{
    if(!moved){
      if(Math.hypot(ev.clientX-sx, ev.clientY-sy) < 6) return;
      moved = true;
      hl = el("div","vhl");
      document.body.appendChild(hl);
    }
    hit = v2Pick(ev.clientX, ev.clientY);
    if(!hit){ hl.style.display = "none"; return; }
    Object.assign(hl.style, {display:"block", left:hit.r.left+"px", top:hit.r.top+"px",
                             width:hit.r.width+"px", height:hit.r.height+"px"});
  };
  const up = ()=>{
    window.removeEventListener("pointermove", mv);
    window.removeEventListener("pointerup", up);
    if(hl) hl.remove();
    if(!moved) return;
    v2Dragged = true; setTimeout(()=>v2Dragged=false, 0);
    if(hit) v2Move(id, hit.node, hit.pos);
    render();
  };
  window.addEventListener("pointermove", mv);
  window.addEventListener("pointerup", up);
}

function v2Node(n){
  if(n.t==="stack") return v2Stack(n);
  if(n.t==="canvas"){
    const c = el("div","canvas");
    c.dataset.leaf = "1"; c._node = n;
    c.innerHTML = canvasHTML() + `<div class="statusbar" style="position:absolute;bottom:0;left:0;right:0">
      <span>Public Channels${state.doc?": 2 aktiv":": no App"}</span><span style="margin-left:auto">Console Output</span></div>`;
    return c;
  }
  const d = el("div","vsplit");
  d.style.flexDirection = n.dir==="h" ? "row" : "column";
  n.kids.forEach(k=>{
    const e = v2Node(k);
    e.style.flex = (k.t==="stack" && n.dir==="h") ? "0 0 min(640px, 52%)" : "1 1 0";
    d.appendChild(e);
  });
  return d;
}
function v2Stack(n){
  const s = el("div","vstack");
  s.dataset.leaf = "1"; s._node = n;
  const w = V2WIN[n.active];
  const head = el("div","win-title vhead");
  head.innerHTML = `<span class="name">${w.title}</span>
    <span style="margin-left:auto;font-size:10px;color:var(--faint)">${w.sub ? w.sub() : "gedockt · Titel ziehen zum Andocken"}</span>
    <button class="wclose" title="Schließen">✕</button>`;
  head.onpointerdown = e=>{ if(!e.target.closest(".wclose")) v2Drag(e, n.active); };
  head.querySelector(".wclose").onclick = ()=>{ state.v2 = v2Remove(state.v2, n.active); render(); };
  const body = el("div","vbody");
  body.appendChild(w.build());
  const tabs = el("div","btabs");
  n.tabs.forEach(id=>{
    const b = el("button", id===n.active ? "on" : "", V2WIN[id].title);
    b.onpointerdown = e=>{ e.stopPropagation(); v2Drag(e, id); };
    b.onclick = ()=>{ if(v2Dragged) return; n.active = id; render(); };
    tabs.appendChild(b);
  });
  s.appendChild(head); s.appendChild(body); s.appendChild(tabs);
  return s;
}

/* Inhalt eines bestehenden Fensters übernehmen (Tabpane ohne eigene Fensterleiste) */
function v2Inner(fn){

function v2Help(){
  const c = el("div","vcol");
  const sw = el("div","fswitch");

    <span class="fhint">${state.followOpen ? "Selektiere ein Node im Patch — passende Help-Patches erscheinen hier" : "aus"}</span>
    <button class="switch${state.followOpen?" on":""}" title="Follow-Mode"><i></i></button>`;
  const sb = sw.querySelector(".switch");
  sb.onclick = ()=>{
    state.followOpen = !state.followOpen;
    if(!flowAdvance("follow-card")) render();

  if(isHot("follow-card")) hot(sb, "follow-card");
  c.appendChild(sw);
  c.appendChild(neuHelp().querySelector(".win.dockwin .tabpane"));
  return c;
}

function v2Settings(){
  const c = el("div","vcol");
  const p = el("div","tabpane on setv2");
  p.innerHTML = `<div class="sg-h">Default</div>
    ${[["dark","dark"],["light","light"],["hc","high contrast"]].map(([k,l])=>
      `<label class="opt"><input type="radio" name="thv2" value="${k}"${state.theme===k?" checked":""}> ${l}</label>`).join("")}
    <div class="sg-h" style="margin-top:14px">Custom themes folder</div>
    <div class="pathrow"><span class="pathtxt">C:\\Users\\ich\\Documents\\vvvv\\gamma-preview\\Themes</span><button class="btn sm">Explore</button></div>
    <button class="btn sm" style="margin-top:6px">Help</button>
    <input class="fsearch setfilter" placeholder="FILTER BY" style="width:100%;margin:16px 0 2px">`;
  p.querySelectorAll("input[name=thv2]").forEach(r=>{
    r.onchange = ()=>{
      state.theme = r.value;
      if(r.value==="dark") delete document.body.dataset.theme; else document.body.dataset.theme = r.value;
      render();
    };
  });
  SETTINGS_V2.forEach(([g, rows])=>{
    p.appendChild(el("div","grp",g));
    rows.forEach(([label, on, extra])=>{
      const r = el("label","opt srow");
      r.dataset.l = label.toLowerCase();
      let tail = "";
      if(extra && extra.startsWith("num:")) tail = `<input class="num" value="${extra.slice(4)}">`;
      if(extra && extra.startsWith("btn:")) tail = `<button class="btn sm">${extra.slice(4)}</button>`;
      r.innerHTML = `<input type="checkbox"${on?" checked":""}> <span class="lt">${label}</span>${tail}`;
      p.appendChild(r);
    });
  });
  p.querySelector(".setfilter").oninput = e=>{
    const q = e.target.value.trim().toLowerCase();
    p.querySelectorAll(".srow").forEach(r=>r.style.display = r.dataset.l.includes(q) ? "" : "none");
  };
  c.appendChild(p);
  return c;
}

/* Version 2: Fenster-Schalter oben, darunter das Dock-Layout im vvvv-Fenster */
function v2Screen(){
  v2Root();
  const wrap = el("div","vwrap");
  const bar = el("div","v2bar");
  bar.innerHTML = `<span class="lbl">Fenster:</span>`;
  [["home","Welcome"],["help","Help"],["packs","Packs"],["ext","Extensions"],["settings","Settings"],["refs","References"]]
    .forEach(([k,l])=>{
      const open = !!v2Find(state.v2, k);
      const b = el("button", open?"on":"", l);
      b.onclick = ()=>{
        if(k==="help" && isHot("tab-help")){ v2Open(k); flowAdvance("tab-help"); return; }
        if(open) state.v2 = v2Remove(state.v2, k); else v2Open(k);
        render();
      };
      if(k==="help" && isHot("tab-help")) hot(b, "tab-help");
      bar.appendChild(b);
    });
  const full = editorShell(null);
  const app = full.querySelector(".app");
  app.innerHTML = "";
  const root = el("div","v2root");
  root.appendChild(v2Node(v2Root()));
  app.appendChild(root);
  wrap.appendChild(bar);
  wrap.appendChild(winShell("vvvv gamma", full));
  return wrap;
}

function setScreen(id){
  state.screen = id;
  if(isV2()) v2Focus(id);
  /* Untere Tabs der Dock-Spalte: „Browser“ merkt sich den zuletzt offenen Tab */
  if(["neu-home","neu-help","neu-packs","neu-ext","neu-shortcuts"].includes(id))
    state.lastBrowser = id;
  if(id==="neu-settings") state.settingsOpen = true;
  const sc = SCREENS.find(s=>s.id===id);
  render();
}
function goto(id){ setScreen(id); }

function flowAdvance(key){
  if(!state.flow) return false;
  const st = FLOWS[state.flow].steps[state.step];
  if(st.key !== key) return false;
  state.step++;
  if(state.step >= FLOWS[state.flow].steps.length){
    const name = FLOWS[state.flow].label;
    state.flow=null; state.step=0;
    render(); showFlowDone(name);
    return true;
  }
  const nxt = FLOWS[state.flow].steps[state.step];
  if(nxt.screen !== state.screen) state.screen = nxt.screen;
  if(isV2()) v2Focus(state.screen);
  render();
  return true;
}

function showFlowDone(name){
  const d = el("div","flowdone on");
  d.innerHTML = `<b>✓ Flow abgeschlossen: ${name}</b><br>
    <span style="color:var(--muted)">Starte ihn jederzeit links erneut — oder probiere einen anderen Flow.</span>`;
  $("#viewport").prepend(d);
}

function startFlow(id){
  clearInterval(extTimer);
  hideRefOverlay();
  state.flow=id; state.step=0;
  if(id==="ref"){ state.doc=null; state.packAdded=false;
                  state.overlayShown=false; state.removed=false; state.refExtra=[]; }
  if(id==="ext"){ state.ext={phase:"idle", pct:0}; }
  if(id==="learn"){ state.helpTypes=[]; state.helpPack="all"; state.helpSearch="";
                    state.helpDl=null; state.followOpen=false; state.helpOpen=null; }
  if(id==="tour"){ state.updatesDone=false; state.doc="callmenames";
                   state.packAdded=false; state.overlayShown=false; state.removed=false;
                   state.discDetail=null; state.packUI=null; }
  if(id==="disc"){ state.installed=null; state.newlyInstalled=null; state.installing=null;
                   state.discDetail=null; state.packUI=null; }
  setScreen(FLOWS[id].steps[0].screen);
}
function cancelFlow(){ clearInterval(extTimer); hideRefOverlay(); state.flow=null; state.step=0; render(); }

function render(){
  clearTimeout(autoTimer);

  /* Topbar-Flow */
  const fb = $("#flowbar");
  if(state.flow){
    const f = FLOWS[state.flow], st = f.steps[state.step];
    fb.classList.add("on");
    $("#flowSteps").textContent = `${f.label} · Schritt ${state.step+1}/${f.steps.length}`;
    const hint = (isV2() && st.key==="follow-card") ? "Schalte den Follow-Mode ein — Schalter oben im Help-Fenster" : st.hint;
    $("#flowHint").innerHTML = `<span class="stepchip">Jetzt</span>${hint}`;
  } else fb.classList.remove("on");

  /* Sidebar */
  const sb = $("#sidebar"); sb.innerHTML="";
  sb.appendChild(el("div","side-group","Flows (klickbar)"));
  Object.entries(FLOWS).forEach(([k,f])=>{
    const b = el("button","nav flow"+(state.flow===k?" on":""), f.label);
    b.onclick = ()=>startFlow(k); sb.appendChild(b);
  });
  [["neu","Vorschlag"]].forEach(([m,label])=>{
    sb.appendChild(el("div","side-group",label));
    SCREENS.filter(s=>s.mode===m).forEach(s=>{
      const b = el("button","nav"+(state.screen===s.id?" on":""));
      b.innerHTML = s.label + ` <span class="tag ${m}">${s.tag}</span>`;
      b.onclick = ()=>setScreen(s.id);
      sb.appendChild(b);
    });
  });

  /* Screen */
  const sc = SCREENS.find(s=>s.id===state.screen) || SCREENS[0];
  const vp = $("#viewport"); vp.innerHTML="";
  const nk = isV2() ? "v2" : sc.note;
  vp.appendChild(el("div","screen-title", NOTES[nk].t));
  vp.appendChild(el("div","screen-sub", NOTES[nk].s));
  vp.appendChild(isV2() ? v2Screen() : sc.build());
  $("#verSeg").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.ver===state.version));
  vp.scrollTop = 0;

  /* Notes */
  const n = NOTES[isV2() ? "v2" : sc.note];
  const nt = $("#notes"); nt.innerHTML="";
  nt.appendChild(el("h3",null,n.t));
  nt.appendChild(el("div","sub",n.s));
  n.p.forEach(p=>nt.appendChild(el("p",null,p)));
  nt.appendChild(el("div","legend",
    `<b style="color:var(--muted)">Pain Points:</b><br>
     P1 System-Übersicht · P2 Fenster-Rollen · P3 Extensions-Feedback<br>
     P4 Redundanz · P5 Taxonomie/Filter · P6 Discovery<br>
     P7 Add-Feedback · P8 Explore-Perspektive<br><br>
     <span style="color:var(--accent)">Orange Rahmen</span> = aktiver Flow-Schritt.`));


  /* __auto__-Schritt */
  if(state.flow){
    const st = FLOWS[state.flow].steps[state.step];
    if(st.key==="__auto__"){
      autoTimer = setTimeout(()=>{
        if(state.flow && FLOWS[state.flow].steps[state.step]?.key==="__auto__")
          flowAdvance("__auto__");
      }, 1600);
    }
  }
}

/* Versions-Umschalter: Version 1 (Tabs) und Version 2 (dockbare Fenster) */
$("#verSeg").querySelectorAll("button").forEach(b=>{
  b.onclick = ()=>{ state.version = b.dataset.ver; render(); };
});

$("#flowCancel").onclick = cancelFlow;

/* Klick auf den Hintergrund schließt das References-Overlay (aber nicht den Ist-Dialog) */
$("#overlay").addEventListener("click", e=>{
  if(e.target.id==="overlay" && state.refOverlay) closeRefOverlay();
});

render();
