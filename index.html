<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vvvv gamma — UX-Prototyp (Ist vs. Vorschlag)</title>
<style>
  :root{
    --bg:#1e1e1e; --panel:#252526; --panel2:#2d2d30; --panel3:#333336;
    --border:#3f3f46; --border2:#4d4d55;
    --text:#d4d4d4; --muted:#9d9da6; --faint:#7a7a82;
    --accent:#f0a232; --accent-dim:#8a5f1e;
    --blue:#569cd6; --green:#6a9955; --red:#f14c4c; --purple:#c586c0;
    --field:#1a1a1a; --field-bd:#3f3f46;   /* Eingabefelder, Canvas */
    --hot:0 0 0 2px var(--accent), 0 0 14px 2px rgba(240,162,50,.55);
    font-size:13px;
  }
  /* Themes (Settings-Fenster) — wirken auf den gesamten Prototyp */
  body[data-theme=light]{
    --bg:#e3e3e1; --panel:#efefef; --panel2:#f7f7f7; --panel3:#e0e0e0;
    --border:#c9c9c9; --border2:#b2b2b2;
    --text:#1e1e1e; --muted:#55555c; --faint:#77777c;
    --field:#ffffff; --field-bd:#c9c9c9;
    --accent:#c47b16; --accent-dim:#e8c890;
    --hot:0 0 0 2px var(--accent), 0 0 14px 2px rgba(196,123,22,.45);
  }
  body[data-theme=hc]{
    --bg:#000; --panel:#000; --panel2:#0a0a0a; --panel3:#141414;
    --border:#9a9a9a; --border2:#cfcfcf;
    --text:#ffffff; --muted:#e6e6e6; --faint:#c9c9c9;
    --field:#000; --field-bd:#9a9a9a;
    --accent:#ffd400; --accent-dim:#5a4a00;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text);
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
       height:100vh; display:flex; flex-direction:column; overflow:hidden}

  /* ---------- Topbar ---------- */
  .topbar{display:flex; align-items:center; gap:16px; padding:7px 14px;
          background:var(--panel); border-bottom:1px solid var(--border); flex:0 0 auto}
  .logo{font-weight:600; letter-spacing:.4px}
  .logo b{color:var(--accent)}
  .seg{display:flex; background:var(--panel2); border:1px solid var(--border); overflow:hidden}
  .seg button{background:none; border:none; color:var(--muted); padding:5px 14px; cursor:pointer; font-size:12px}
  .seg button.on{background:var(--accent); color:#1e1e1e; font-weight:600}
  .seg button:not(.on):hover{background:var(--panel3); color:var(--text)}
  .flowbar{margin-left:auto; display:none; align-items:center; gap:10px; background:var(--panel2);
           border:1px solid var(--accent-dim); padding:5px 12px; font-size:12px}
  .flowbar.on{display:flex}
  .flowbar .steps{color:var(--accent); font-weight:600}
  .flowbar .hint{color:var(--text)}
  .flowbar button{background:none; border:1px solid var(--border); color:var(--muted);
                  padding:2px 8px; cursor:pointer; font-size:11px}
  .flowbar button:hover{color:var(--text); border-color:var(--border2)}

  /* ---------- Layout ---------- */
  .main{display:flex; flex:1 1 auto; min-height:0}
  .sidebar{width:230px; flex:0 0 auto; background:var(--panel); border-right:1px solid var(--border);
           padding:12px 0; overflow-y:auto}
  .side-group{padding:0 14px; margin:14px 0 6px; font-size:10px; text-transform:uppercase;
              letter-spacing:1.2px; color:var(--faint)}
  .side-group:first-child{margin-top:0}
  .nav{display:block; width:100%; text-align:left; background:none; border:none; color:var(--muted);
       padding:7px 14px; cursor:pointer; font-size:12.5px; border-left:2px solid transparent}
  .nav:hover{background:var(--panel2); color:var(--text)}
  .nav.on{background:var(--panel2); color:var(--text); border-left-color:var(--accent); font-weight:600}
  .nav .tag{font-size:9.5px; padding:1px 5px; margin-left:6px; vertical-align:1px}
  .tag.neu{background:#2e4a36; color:#9fd6af}
  .nav.flow{color:var(--blue)}
  .nav.flow:hover{background:#26313a}
  .nav.flow.on{background:#26313a; color:var(--blue); border-left-color:var(--blue)}

  .stage{flex:1 1 auto; display:flex; min-width:0}
  .viewport{flex:1 1 auto; overflow-y:auto; padding:24px 28px; min-width:0}
  .notes{width:300px; flex:0 0 auto; background:var(--panel); border-left:1px solid var(--border);
         padding:16px; overflow-y:auto; font-size:12.5px; line-height:1.55}
  .notes h3{font-size:13px; margin-bottom:4px; color:var(--accent)}
  .notes .sub{color:var(--faint); font-size:11px; margin-bottom:14px}
  .notes p{margin-bottom:10px; color:var(--muted)}
  .notes p b{color:var(--text); font-weight:600}
  .legend{margin-top:14px; padding-top:12px; border-top:1px solid var(--border);
          font-size:11px; color:var(--faint); line-height:1.6}

  /* ---------- Screen frame ---------- */
  .screen-title{font-size:15px; font-weight:600; margin-bottom:3px}
  .screen-sub{color:var(--muted); font-size:12px; margin-bottom:16px}
  .win{background:var(--panel2); border:1px solid var(--border2); overflow:hidden;
       box-shadow:0 8px 30px rgba(0,0,0,.35); max-width:1180px}
  .win-title{display:flex; align-items:center; gap:8px; padding:6px 12px;
             background:var(--panel3); border-bottom:1px solid var(--border); font-size:12px; color:var(--muted)}
  .win-title .name{color:var(--text); font-weight:600}
  /* Schließen rechts oben (Windows-Stil statt Mac-Punkte) */
  .wclose{margin-left:auto; background:none; border:1px solid transparent; color:var(--muted);
          cursor:pointer; font-size:12px; line-height:1; padding:2px 7px; font-family:inherit}
  .wclose:hover{color:var(--red); border-color:var(--border2); background:var(--panel2)}
  .win-body{padding:0}

  /* ---------- vvvv-Nachbau: Menü, Canvas, Panel ---------- */
  .mbar{display:flex; gap:0; padding:0; background:var(--panel3); border-bottom:1px solid var(--border); font-size:11.5px; color:var(--muted)}
  .mbar span{padding:5px 10px; cursor:pointer}
  .mbar span:hover{background:#3f3f46; color:var(--text)}
  .app{display:flex; min-height:420px; position:relative}
  .canvas{flex:1 1 auto; background:#1a1a1a; border-right:1px solid var(--border); padding:14px; position:relative; min-width:0}
  .canvas .empty{color:var(--faint); font-size:12px; text-align:center; padding-top:80px}
  .canvas .node{display:inline-block; background:#333336; border:1px solid #4d4d55; color:#cfd0d5;
                padding:4px 10px; font-size:11px; margin:4px}
  .canvas .docname{position:absolute; top:8px; left:12px; font-size:10.5px; color:var(--faint)}
  .dock{width:290px; flex:0 0 auto; background:var(--panel); display:flex; flex-direction:column; min-width:0}
  .dock-head{padding:8px 10px; border-bottom:1px solid var(--border); font-size:12px; font-weight:600;
             display:flex; flex-wrap:wrap; gap:1px 6px; align-items:baseline}
  .dock-head .sub{color:var(--faint); font-weight:400; font-size:10.5px; margin-left:auto}
  .dock-body{padding:8px; flex:1 1 auto; font-size:11.5px; overflow-y:auto}
  .btabs{display:flex; border-top:1px solid var(--border); background:var(--panel3)}
  .btabs button{flex:1 1 auto; background:none; border:none; border-right:1px solid var(--border);
                color:var(--muted); padding:6px 4px; font-size:11.5px; cursor:pointer}
  .btabs button:last-child{border-right:none}
  .btabs button.on{background:var(--panel); color:var(--text); font-weight:600; box-shadow:inset 0 2px 0 var(--accent)}
  .btabs button:not(.on):hover{background:#3f3f46; color:var(--text)}
  .statusbar{display:flex; gap:16px; padding:4px 10px; background:var(--panel3); border-top:1px solid var(--border);
             font-size:10.5px; color:var(--faint)}

  .row{display:flex; align-items:center; gap:7px; padding:5px 7px; color:var(--muted);
       font-size:11.5px; border:1px solid transparent}
  .row:hover{background:var(--panel2)}
  .row .ico{width:14px; text-align:center; color:var(--faint)}
  .row.ok .ico{color:var(--green)}
  .row.miss{background:rgba(241,76,76,.09); border-color:rgba(241,76,76,.4); color:#e8a49c}
  .row.miss .ico{color:var(--red)}
  .row .meta{margin-left:auto; color:var(--faint); font-size:10.5px; white-space:nowrap}
  .row .upd{background:rgba(86,156,214,.15); color:var(--blue); font-size:9.5px; padding:1px 6px; margin-left:6px}
  .row .star{cursor:pointer; color:var(--faint)}
  .row .star.on{color:var(--accent)}
  .sec{color:var(--faint); font-size:10px; text-transform:uppercase; letter-spacing:.8px; padding:8px 7px 3px}
  .emptybox{border:1px dashed var(--border2); padding:16px 12px; text-align:center;
            color:var(--faint); font-size:11.5px; line-height:1.6; margin:6px 0}
  .emptybox b{color:var(--muted); display:block; margin-bottom:3px; font-size:12px}

  .btn{background:var(--panel3); border:1px solid var(--border2); color:var(--text);
       padding:4px 10px; font-size:11.5px; cursor:pointer; font-family:inherit}
  .btn:hover{border-color:var(--accent-dim); color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#1e1e1e; font-weight:600}
  .btn.primary:hover{filter:brightness(1.08); color:#1e1e1e}
  .btn.ghost{background:none}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.sm{padding:2px 8px; font-size:10.5px}
  .btnrow{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}

  /* ---------- Browser (Neu) ---------- */
  .tabs{display:flex; background:var(--panel3); border-bottom:1px solid var(--border); padding:0 6px}
  .tab{background:none; border:none; color:var(--muted); padding:9px 16px; cursor:pointer; font-size:12.5px;
       border-bottom:2px solid transparent; display:flex; align-items:center; gap:6px; font-family:inherit}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--accent); border-bottom-color:var(--accent); font-weight:600; background:var(--panel2)}
  .tab .bdg{font-size:9px; background:rgba(240,162,50,.18); color:var(--accent); padding:1px 5px}
  .tab .bdg.blue{background:rgba(86,156,214,.18); color:var(--blue)}
  .tabpane{display:none; padding:16px}
  .tabpane.on{display:block}
  .h2{font-size:13px; font-weight:600; margin:14px 0 8px}
  .h2:first-child{margin-top:0}
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .card{background:var(--panel); border:1px solid var(--border); padding:11px 12px; font-size:11.5px}
  .card .t{font-weight:600; color:var(--text); font-size:12px; margin-bottom:3px}
  .card .d{color:var(--muted); line-height:1.5}
  .card.click{cursor:pointer}
  .card.click:hover{border-color:var(--accent-dim)}
  .statusline{display:flex; align-items:center; gap:10px; background:rgba(86,156,214,.1);
              border:1px solid rgba(86,156,214,.35); padding:9px 12px;
              font-size:12px; color:#b9d9f3; margin-bottom:14px}
  .statusline b{color:var(--blue)}
  .statusline .btn{margin-left:auto}

  .notice{display:flex; gap:9px; align-items:center; background:rgba(86,156,214,.08);
          border:1px solid rgba(86,156,214,.3); padding:9px 12px;
          font-size:11.5px; color:#b9d9f3; margin-bottom:10px; line-height:1.5}
  .notice .btn{margin-left:auto; flex:0 0 auto}
  .notice.warn{background:rgba(240,162,50,.08); border-color:rgba(240,162,50,.3); color:#e8c890}
  .notice.good{background:rgba(106,153,85,.1); border-color:rgba(106,153,85,.4); color:#a8d8a0}
  .notice.bad{background:rgba(241,76,76,.09); border-color:rgba(241,76,76,.35); color:#e8a49c}

  .prog{height:4px; background:var(--panel3); overflow:hidden; margin-top:6px}
  .prog i{display:block; height:100%; width:0%; background:var(--accent); transition:width .25s}
  .extrow{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border);
          background:var(--panel); margin-bottom:8px; font-size:12px}
  .extrow .ico{font-size:15px; width:20px; text-align:center; color:var(--faint)}
  .extrow .info{flex:1 1 auto; min-width:0}
  .extrow .info .t{font-weight:600}
  .extrow .info .d{color:var(--muted); font-size:11px; margin-top:1px}
  .extrow .state{flex:0 0 auto; text-align:right; font-size:11px; color:var(--muted)}
  .extrow.done{border-color:rgba(106,153,85,.45)}
  .extrow.fail{border-color:rgba(241,76,76,.45)}
  .spin{display:inline-block; width:11px; height:11px; border:2px solid var(--accent-dim);
        border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .anchor{color:var(--blue); cursor:pointer; text-decoration:underline; text-decoration-style:dotted;
          background:none; border:none; font-size:11.5px; padding:0; font-family:inherit}
  .anchor:hover{color:var(--accent)}

  /* Help: Filter-Liste links + Liste rechts (Layout wie Ist) */
  .hb:not(.backlink){display:flex; min-height:340px}
  .hb-nav{width:200px; flex:0 0 auto; border-right:1px solid var(--border); padding:10px 0; background:var(--panel)}
  .hb-nav .grp{padding:6px 14px 3px; font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--faint)}
  .hb-nav button{display:flex; width:100%; text-align:left; background:none; border:none; color:var(--muted);
                 padding:6px 14px; font-size:12px; cursor:pointer; border-left:2px solid transparent; font-family:inherit;
                 align-items:center; gap:6px}
  .hb-nav button:hover{background:var(--panel2); color:var(--text)}
  .hb-nav button.on{background:var(--panel2); color:var(--text); border-left-color:var(--accent); font-weight:600}
  .hb-nav button .n{margin-left:auto; font-size:9.5px; color:var(--faint)}
  .hb-nav button .neu{font-size:8.5px; background:rgba(240,162,50,.2); color:var(--accent); padding:0 4px}
  .hb-nav a.gw{color:var(--blue); text-decoration:none}
  .hb-nav a.gw:hover{color:var(--accent); text-decoration:underline}
  .hb-main{flex:1 1 auto; padding:12px 14px; min-width:0}
  .hb-toolbar{display:flex; gap:8px; align-items:center; margin-bottom:10px; font-size:11.5px; color:var(--muted)}
  .hb-toolbar .sp{margin-left:auto; color:var(--faint); font-size:10.5px}
  .hl{display:flex; gap:10px; padding:8px 10px; border:1px solid var(--border);
      background:var(--panel); margin-bottom:6px; font-size:11.5px; align-items:baseline}
  .hl .badge{flex:0 0 auto; font-size:9px; font-weight:700; padding:2px 6px; text-transform:uppercase; letter-spacing:.5px}
  .badge.howto{background:#3a3550; color:#b9a7e8}
  .badge.tut{background:#2e4a36; color:#9fd6af}
  .badge.video{background:#4a3a20; color:#f0c27a}
  .badge.ref{background:#26384a; color:#9fc7ea}
  .badge.ex{background:#40323a; color:#e8a4c0}
  .hl .t{color:var(--text); font-weight:600; flex:1 1 auto}
  .hl .t a{color:var(--blue); text-decoration:none}
  .hl .t a:hover{color:var(--accent); text-decoration:underline}
  .hl .m{color:var(--faint); font-size:10.5px; flex:0 0 auto}
  .hl .go{flex:0 0 auto; color:var(--faint); font-size:10.5px}
  .packhdr{display:flex; align-items:center; gap:8px; margin:14px 0 6px; font-size:12px; font-weight:600; color:var(--text)}
  .packhdr .m{font-weight:400; color:var(--faint); font-size:10.5px}
  .packhdr .btn{margin-left:auto}

  .segment{display:flex; gap:2px; background:var(--panel3); padding:3px; margin-bottom:12px; width:fit-content}
  .segment button{background:none; border:none; color:var(--muted); padding:5px 16px; cursor:pointer; font-size:12px; font-family:inherit}
  .segment button.on{background:var(--panel); color:var(--text); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.3)}

  /* ---------- Chips / Filterzeile (Packs, wie im Ist-Design) ---------- */
  .chiprow{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:11.5px}
  .chip{border:1px solid var(--border2); background:none; color:var(--muted); padding:3px 10px;
        cursor:pointer; font-size:11.5px; font-family:inherit}
  .chip:hover{color:var(--text); border-color:var(--accent-dim)}
  .chip.on{background:var(--panel3); color:var(--text); border-color:var(--accent); font-weight:600}
  .chiprow .sp{margin-left:auto; color:var(--faint); font-size:10.5px}
  .chiprow select, .fsearch{background:var(--field); border:1px solid var(--field-bd); color:var(--text);
        font-size:11.5px; padding:4px 7px; font-family:inherit}
  .fsearch{flex:1 1 auto; min-width:150px}
  .psel{background:var(--field); border:1px solid var(--field-bd); color:var(--text); font-size:11px; padding:3px 6px; font-family:inherit}
  .pbar{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:8px; font-size:11.5px}
  .pbar .fsearch{flex:1 1 180px}
  .pstable{font-size:10.5px; color:var(--faint); display:flex; gap:4px; align-items:center; cursor:pointer}
  .sect{display:flex; align-items:center; gap:7px; margin:12px 0 5px; font-size:11.5px; font-weight:600; color:var(--text); cursor:pointer; user-select:none}
  .sect .car{color:var(--faint); width:10px}
  .sect .cnt{font-weight:400; color:var(--faint); font-size:10.5px}
  .tdot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px}
  .tdot.tut{background:#9fd6af} .tdot.expl{background:#f0d08a} .tdot.howto{background:#b9a7e8}
  .tdot.ref{background:#9fc7ea} .tdot.ex{background:#e8a4c0}
  .badge.expl{background:#4a3e22; color:#f0d08a}
  /* Help-Pane: eigener Scrollbereich — nur die Inhalte unterhalb der Navi scrollen */
  .hbpane{display:flex; flex-direction:row; flex:1 1 auto; min-height:0; background:var(--panel2)}
  .hbpane .pbar{margin:0; padding:9px 12px; background:var(--panel); border-bottom:1px solid var(--border); flex:0 0 auto}
  .hbpane .hmeta{flex:0 0 auto; padding:7px 12px 0}
  .hbscroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; min-height:0; padding:0 12px 14px; position:relative}
  /* Help-Sidebar: Typ oben (fest), Pack-Liste darunter (scrollt separat) */
  .hbside{width:196px; flex:0 0 auto; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0}
  .hbtypes{flex:0 0 auto; padding:6px 0; border-bottom:1px solid var(--border)}
  .hbpacks{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; min-height:0; padding:0 0 8px}
  .hbside .sg{padding:7px 12px 3px; font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--faint)}
  .hbside button{display:flex; align-items:center; gap:6px; width:100%; background:none; border:none; border-left:2px solid transparent;
                 color:var(--muted); font-family:inherit; font-size:11.5px; padding:4px 10px; cursor:pointer; text-align:left; min-width:0}
  .hbside button:hover{background:var(--panel2); color:var(--text)}
  .hbside button.on{background:var(--panel2); color:var(--text); border-left-color:var(--accent); font-weight:600}
  .hbside button.in{background:rgba(106,153,85,.07)}
  .hbside button .nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hbside button .n{flex:0 0 auto; color:var(--faint); font-size:10px}
  .hbmain{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; min-height:0}
  .hbmain .pbar{margin:0; padding:9px 12px; background:var(--panel); border-bottom:1px solid var(--border); flex:0 0 auto}
  .hbmain .hmeta{flex:0 0 auto; padding:6px 12px 0}
  /* Pack-Kopf: klebt oben im Scrollbereich, Sprungmarke der Sidebar zielt darauf */
  .pkh{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:9px 4px 7px; margin-top:12px;
       background:var(--panel2); border-bottom:1px solid var(--border)}
  .pkh.in{box-shadow:inset 3px 0 0 var(--green)}
  .pkh .pkn{font-size:13px; font-weight:600; color:var(--text); white-space:nowrap}
  .pkh .pkc{font-size:10.5px; color:var(--accent); flex:0 0 auto}
  .pkh .pka{font-size:10.5px; color:var(--faint); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pkh .pkx{margin-left:auto; flex:0 0 auto; display:flex; gap:6px; align-items:center}
  .dlx{display:inline-flex; align-items:center; gap:6px; font-size:10px; color:var(--accent)}
  .dlx .pct{font-variant-numeric:tabular-nums; min-width:30px; text-align:right}
  .mini{display:inline-block; width:64px; height:4px; background:var(--panel3); overflow:hidden; vertical-align:middle}
  .mini i{display:block; height:100%; width:0%; background:var(--accent); transition:width .12s linear}
  /* Pack-Index (Ruhezustand): eine Zeile pro Pack, Accordion */
  .hindex{display:flex; align-items:baseline; gap:10px; width:100%; background:none; border:none;
          border-bottom:1px solid var(--border); color:var(--text); font-size:13px; padding:9px 4px;
          cursor:pointer; font-family:inherit; text-align:left}
  .hindex:hover{background:var(--panel)}
  .hindex .nm{font-weight:600; flex:0 0 auto}
  .hindex .n{color:var(--accent); font-size:10.5px; flex:0 0 auto}
  .hindex .d{color:var(--faint); font-size:11px; flex:1 1 auto; min-width:0;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hindex .car{color:var(--faint); flex:0 0 auto; width:10px}
  /* Help-Index: nur grüner Zeilentön bei installierten Packs — kein Text, kein Badge */
  .hindex.in{background:rgba(106,153,85,.07)}
  .hindex.in:hover{background:rgba(106,153,85,.12)}
  /* Treffer-Hervorhebung der Volltextsuche */
  .hit{background:none; color:var(--blue); text-decoration:underline;
       text-decoration-color:#41befb; text-decoration-thickness:2px; text-underline-offset:3px}
  /* Download-Fortschritt: Balken in der Help-Zeile bzw. in der Pack-Zeile */
  .dlbar{display:inline-flex; align-items:center; gap:6px; min-width:118px}
  .dlbar .track{display:block; flex:1 1 auto; height:4px; background:var(--panel3); overflow:hidden}
  .dlbar .track i{display:block; height:100%; width:0%; background:var(--accent); transition:width .12s linear}
  .dlbar .pct{font-size:9.5px; color:var(--accent); font-variant-numeric:tabular-nums; width:30px; text-align:right}
  .dlbar .x{background:none; border:none; color:var(--faint); cursor:pointer; font-size:11px; padding:0 2px; font-family:inherit}
  .dlbar .x:hover{color:var(--text)}
  .dlbar.err .track i{background:var(--red)}
  .dlbar.err .pct{color:#e8a49c}
  .prow.dl{background:rgba(240,162,50,.05); position:relative}
  .prow{position:relative}
  .prow .rowbar{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--panel3)}
  .prow .rowbar i{display:block; height:100%; width:0%; background:var(--accent); transition:width .12s linear}
  /* Pack-Kopf + Sektionen + Einträge — Struktur wie der Help-Browser [Fundamentals-Screenshot] */
  .pkhead{margin:22px 0 6px}
  .pkhead:first-of-type{margin-top:4px}
  .pkhead .t{font-size:22px; font-weight:700; color:var(--text); line-height:1.2; letter-spacing:-.2px}
  .pkhead .m{color:var(--faint); font-size:11px; line-height:1.65; margin-top:7px}
  .pkhead .btn{margin-top:9px}
  .hsec{font-size:13.5px; font-weight:600; color:var(--text); margin:18px 0 7px;
        text-decoration:underline; text-underline-offset:5px; text-decoration-color:var(--blue)}
  .hentries{column-count:2; column-gap:34px}
  .hentry{display:flex; align-items:flex-start; gap:7px; width:100%; background:none; border:none;
          color:var(--text); font-size:12.5px; padding:3px 0; cursor:pointer; font-family:inherit;
          text-align:left; break-inside:avoid; line-height:1.45}
  .hentry:hover{color:var(--accent)}
  .hentry .tdot{margin-top:6px; flex:0 0 auto}
  .hentry .et{flex:1 1 auto; min-width:0}
  .hentry .ei{flex:0 0 auto; color:var(--faint); font-size:11px; margin-left:2px}

  /* ---------- Entdecken (nuget.org-Browser) ---------- */
  .disc{display:flex; min-height:330px; border:1px solid var(--border); background:var(--panel2)}
  .catrail{width:168px; flex:0 0 auto; background:var(--panel); border-right:1px solid var(--border); padding:8px 0}
  .catrail .grp{padding:6px 13px 3px; font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--faint)}
  .catrail button{display:flex; width:100%; text-align:left; background:none; border:none; color:var(--muted);
                  padding:5px 13px; font-size:11.5px; cursor:pointer; border-left:2px solid transparent;
                  font-family:inherit; align-items:center; gap:6px}
  .catrail button:hover{background:var(--panel2); color:var(--text)}
  .catrail button.on{background:var(--panel2); color:var(--text); border-left-color:var(--accent); font-weight:600}
  .catrail button .n{margin-left:auto; font-size:9.5px; color:var(--faint)}
  .disc-main{flex:1 1 auto; padding:10px 12px; min-width:0}
  .disc-toolbar{display:flex; gap:8px; align-items:center; margin-bottom:9px; flex-wrap:wrap}
  .disc-toolbar .sp{margin-left:auto; color:var(--faint); font-size:10.5px}
  .pcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px}
  .pcard{background:var(--panel); border:1px solid var(--border); padding:9px 10px; font-size:11.5px;
         cursor:pointer; text-align:left; font-family:inherit; color:var(--text); display:block;
         width:100%; min-width:0}
  .pcard:hover{border-color:var(--accent-dim)}
  .pcard .top{display:flex; gap:9px; align-items:flex-start; min-width:0}
  .pcard .top>div{min-width:0}
  .picon{width:34px; height:34px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
         background:var(--panel3); border:1px solid var(--border2); color:var(--accent);
         font-size:15px; font-weight:700; font-family:Consolas,monospace}
  .pcard .nm{font-weight:600; color:var(--text); font-size:12px; line-height:1.3;
             overflow-wrap:anywhere; padding-right:15px}
  .pcard .au{color:var(--faint); font-size:10.5px; margin-top:1px}
  .pcard .meta{display:flex; gap:9px; color:var(--faint); font-size:10px; margin-top:6px; flex-wrap:wrap; align-items:center}
  .pcard .act{margin-top:8px; display:flex; gap:6px; align-items:center}
  .pcard.inst{border-color:rgba(106,153,85,.45); background:rgba(106,153,85,.05)}
  .pcard .fav{position:absolute; top:7px; right:8px; color:var(--faint); font-size:12px; cursor:pointer}
  .pcard .fav.on{color:var(--accent)}
  .pcard{position:relative}
  .backlink{background:none; border:none; color:var(--blue); cursor:pointer; font-size:11.5px;
            font-family:inherit; padding:0 0 9px 0; text-align:left}
  .backlink:hover{color:var(--accent)}
  .pdhead{display:flex; gap:12px; align-items:flex-start; margin-bottom:12px}
  .pdhead .picon{width:46px; height:46px; font-size:20px}
  .pdhead .nm{font-size:15px; font-weight:600; color:var(--text)}
  .pdhead .au{color:var(--muted); font-size:11.5px; margin-top:2px}
  .pdhead .meta{display:flex; gap:12px; color:var(--faint); font-size:10.5px; margin-top:6px; flex-wrap:wrap}
  .pdhead .act{margin-left:auto; display:flex; gap:6px; flex:0 0 auto}

  /* gerendertes Readme */
  .readme{background:var(--panel); border:1px solid var(--border); padding:14px 16px;
          font-size:12px; line-height:1.65; color:var(--muted)}
  .readme h1{font-size:15px; color:var(--text); margin-bottom:7px; border-bottom:1px solid var(--border); padding-bottom:6px}
  .readme h2{font-size:12.5px; color:var(--text); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.6px}
  .readme p{margin-bottom:8px}
  .readme ul{margin:0 0 8px 18px}
  .readme li{margin-bottom:3px}
  .readme code{background:var(--field); border:1px solid var(--field-bd); padding:1px 5px;
               font-family:Consolas,monospace; font-size:11px; color:#ce9178}
  .readme pre{background:var(--field); border:1px solid var(--field-bd); padding:9px 11px;
              font-family:Consolas,monospace; font-size:11px; color:var(--text); overflow-x:auto;
              margin-bottom:9px; white-space:pre-wrap}
  .readme .rbadge{display:inline-block; background:var(--panel3); border:1px solid var(--border2);
                  color:var(--muted); font-size:10px; padding:1px 6px; margin:0 5px 7px 0}
  .readme .shot{display:flex; gap:5px; margin-bottom:9px}
  .readme .shot i{display:block; width:46px; height:30px; background:linear-gradient(135deg,#3a3a40,#22222a);
                  border:1px solid var(--border2)}

  /* ---------- Settings: Theme-Switcher (keine Sub-Tabs) ---------- */
  .themes{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px}
  .theme{border:1px solid var(--border); background:var(--panel); padding:10px; cursor:pointer;
         text-align:left; font-family:inherit; color:var(--text)}
  .theme:hover{border-color:var(--accent-dim)}
  .theme.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .theme .sw{display:flex; gap:4px; margin-bottom:8px}
  .theme .sw i{display:block; width:24px; height:15px; border:1px solid rgba(127,127,127,.55)}
  .theme .nm{font-weight:600; font-size:12px}
  .theme .d{color:var(--faint); font-size:10.5px; margin-top:3px; line-height:1.5}

  /* ---------- Shortcuts ---------- */
  .scgrp{margin-top:14px}
  .scgrp .g{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--faint); margin-bottom:5px}
  .scrow{display:flex; gap:10px; padding:7px 10px; border:1px solid var(--border); background:var(--panel);
         margin-bottom:5px; font-size:11.5px; align-items:center}
  .scrow .t{flex:1 1 auto; color:var(--text)}
  .scrow .t small{display:block; color:var(--faint); font-size:10px; margin-top:1px}
  .scrow .k{flex:0 0 auto; text-align:right; white-space:nowrap}
  .kbd{display:inline-block; background:var(--panel3); border:1px solid var(--border2); border-bottom-width:2px;
       color:var(--text); font-family:Consolas,monospace; font-size:10.5px; padding:1px 6px;
       margin:0 3px 2px 0; border-radius:2px}

  /* ---------- Overlay/Toast ---------- */
  .overlay{position:absolute; inset:0; background:rgba(20,21,24,.72); display:none;
           align-items:center; justify-content:center; z-index:40}
  .overlay.on{display:flex}
  .dialog{background:var(--panel2); border:1px solid var(--border2); padding:20px 22px;
          width:340px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5)}
  /* großer Overlay-Dialog (Packs / Assemblies / Files) — wie das Ist-Overlay */
  .dialog.wide{width:680px; max-width:calc(100vw - 60px); text-align:left; padding:0; overflow:hidden}
  .dialog.wide .dlg-head{display:flex; align-items:center; gap:9px; padding:11px 16px;
          border-bottom:1px solid var(--border); background:var(--panel3); font-weight:600; font-size:13px}
  .dialog.wide .dlg-head .x{margin-left:auto; background:none; border:none; color:var(--muted);
          cursor:pointer; font-size:15px; line-height:1; padding:2px 6px; font-family:inherit}
  .dialog.wide .dlg-head .x:hover{color:var(--accent)}
  .dialog.wide .dlg-body{padding:14px 16px; max-height:56vh; overflow-y:auto}
  .dialog.wide .dlg-foot{display:flex; gap:8px; justify-content:flex-end; align-items:center;
          padding:11px 16px; border-top:1px solid var(--border); background:var(--panel3); font-size:11px; color:var(--faint)}

  /* ---------- Browse-Overlay: liegt NUR über dem Reference-Fenster (Runde 6) ----------
     Stil des .NET-Assembly-Fensters: Titel + ✕ rechts, Suche mit ✕,
     Kategorie-Accordion, Footer „Indexed at … | Refresh“ + „Only Stable Versions“ */
  .refshade{position:absolute; inset:0; z-index:24; background:rgba(20,21,24,.55)}
  .refpanel{position:absolute; left:14px; right:14px; top:12%; bottom:12%; z-index:25; display:flex; flex-direction:column;
            background:var(--panel2); border:1px solid var(--border2); box-shadow:0 18px 48px rgba(0,0,0,.55)}
  .refpanel .rp-head{display:flex; align-items:center; gap:9px; flex:0 0 auto;
            padding:10px 14px; background:var(--panel3); border-bottom:1px solid var(--border);
            font-weight:600; font-size:13px; color:var(--text)}
  .refpanel .rp-head .x{margin-left:auto; background:none; border:none; color:var(--muted);
            cursor:pointer; font-size:15px; line-height:1; padding:2px 6px; font-family:inherit}
  .refpanel .rp-head .x:hover{color:var(--accent)}
  .refpanel .rp-search{display:flex; align-items:center; gap:7px; flex:0 0 auto;
            padding:10px 14px; border-bottom:1px solid var(--border)}
  .refpanel .rp-search input{flex:1 1 auto; background:var(--field); border:1px solid var(--field-bd);
            color:var(--text); padding:5px 8px; font-size:11.5px; font-family:inherit}
  .refpanel .rp-search .clr{background:none; border:none; color:var(--faint); cursor:pointer;
            font-size:12px; padding:0 4px; font-family:inherit}
  .refpanel .rp-search .clr:hover{color:var(--text)}
  .refpanel .rp-body{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; min-height:0; padding:10px 14px}
  .refpanel .rp-foot{display:flex; align-items:center; gap:10px; flex:0 0 auto;
            padding:9px 14px; border-top:1px solid var(--border); background:var(--panel3);
            font-size:10.5px; color:var(--faint)}
  .refpanel .rp-foot .stable{margin-left:auto; display:flex; gap:5px; align-items:center; cursor:pointer}
  .refpanel .rp-foot .refresh{background:none; border:none; color:var(--blue); cursor:pointer;
            font-size:10.5px; font-family:inherit; padding:0}
  .refpanel .rp-foot .refresh:hover{color:var(--accent)}
  /* Kategorie-Accordion im Overlay */
  .racc{border-bottom:1px solid var(--border)}
  .racc .hd{display:flex; align-items:center; gap:7px; width:100%; background:none; border:none;
            color:var(--text); font-size:11.5px; font-weight:600; padding:7px 2px; cursor:pointer;
            font-family:inherit; text-align:left}
  .racc .hd .car{color:var(--faint); width:10px}
  .racc .hd .cnt{font-weight:400; color:var(--faint); font-size:10.5px}
  .racc .hd .sp{margin-left:auto; color:var(--faint); font-size:10px; font-weight:400}
  .racc .bd{padding:2px 0 9px}
  .racc .opt{display:flex; align-items:center; gap:7px; width:100%; background:none; border:none;
             color:var(--muted); font-size:11.5px; padding:4px 4px 4px 17px; cursor:pointer;
             font-family:inherit; text-align:left}
  .racc .opt:hover{color:var(--text); background:var(--panel)}
  .racc .opt.on{color:var(--text); font-weight:600}
  .racc .opt .n{margin-left:auto; color:var(--faint); font-size:10px}

  /* Pack-Zeile im Overlay: Stern · Name · Version-Dropdown · Downloads · Aktion */
  .prow{display:flex; align-items:center; gap:8px; padding:7px 8px; border:1px solid var(--border);
        background:var(--panel); margin-bottom:6px; font-size:11.5px}
  .prow.in{border-color:rgba(106,153,85,.45); background:rgba(106,153,85,.06)}
  .prow .star{cursor:pointer; color:var(--faint)}
  .prow .star.on{color:var(--accent)}
  .prow .nm{font-weight:600; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .prow .ver{flex:0 0 auto}
  .prow select{background:#1a1a1a; border:1px solid var(--border2); color:var(--text);
               font-size:11px; padding:2px 4px; font-family:inherit}
  .prow .dl{flex:0 0 auto; color:var(--faint); font-size:10.5px; width:78px; text-align:right}
  .prow .act{flex:0 0 auto; width:96px; text-align:right}

  /* ---------- Pack-Zeile im Screenshot-Stil (Runde 6) ----------
     Icon-Quadrat · Name + Autor · Beschreibung + Tags · Version ▾ · Statuspunkt ·
     Aktionsbutton · ⋯ · Stern · Help-Icon · Downloads */
  .prow.shot{display:flex; align-items:flex-start; gap:10px; padding:9px 10px; position:relative}
  .prow.shot .sq{width:30px; height:30px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
                 background:var(--panel3); border:1px solid var(--border2); color:var(--accent);
                 font-size:14px; font-weight:700; font-family:Consolas,monospace}
  .prow.shot .info{flex:1 1 auto; min-width:0}
  .prow.shot .nm{font-weight:600; font-size:12px; color:var(--text); line-height:1.35}
  .prow.shot .au{color:var(--faint); font-size:10.5px; margin-top:1px}
  .prow.shot .dsc{color:var(--muted); font-size:11px; margin-top:3px; line-height:1.45;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .prow.shot .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px}
  .prow.shot .tg{border:1px solid var(--border2); color:var(--faint); font-size:9.5px; padding:1px 6px}
  .prow.shot .side{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:150px}
  .prow.shot .side .l1{display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--muted)}
  .prow.shot .side .l2{display:flex; align-items:center; gap:8px}
  .prow.shot .helpico{color:var(--faint); font-size:12px; cursor:pointer; background:none; border:none;
                      padding:0 2px; font-family:inherit}
  .prow.shot .helpico:hover{color:var(--accent)}
  .prow.shot .more{color:var(--faint); cursor:pointer; background:none; border:none; font-size:13px;
                   padding:0 3px; font-family:inherit; letter-spacing:1px}
  .prow.shot .more:hover{color:var(--text)}
  .prow.shot .dl{width:auto; text-align:right}
  /* Statuspunkt: grau = nicht installiert · grün = installiert · blau = Update · orange = lädt */
  .sdot{display:inline-block; width:8px; height:8px; border-radius:50%; flex:0 0 auto; background:#5a5a63}
  .sdot.ok{background:var(--green)}
  .sdot.upd{background:var(--blue)}
  .sdot.busy{background:var(--accent); animation:pulse2 1s ease-in-out infinite}
  @keyframes pulse2{0%,100%{opacity:1} 50%{opacity:.35}}
  .badge.bi{background:rgba(106,153,85,.16); border:1px solid rgba(106,153,85,.5); color:#a8d8a0;
            font-size:9px; font-weight:700; padding:1px 5px; text-transform:uppercase; letter-spacing:.5px}

  /* NuGet-Pfad / Startup-Command */
  .pathbox{display:flex; align-items:center; gap:8px; background:#1a1a1a; border:1px solid var(--border);
           padding:7px 10px; font-family:Consolas,"Courier New",monospace; font-size:11px; color:#b9d9f3;
           margin:6px 0; word-break:break-all}
  .pathbox .btn{font-family:"Segoe UI",system-ui,sans-serif; margin-left:auto; flex:0 0 auto}
  .cmd{background:#1a1a1a; border:1px solid var(--border); padding:6px 9px; font-size:10.5px;
       font-family:Consolas,"Courier New",monospace; color:#ce9178; margin-top:5px; word-break:break-all}

  /* Dock-Fenster: References und Browser teilen dieselbe Fenster-Chrome */
  .win.dockwin{position:relative; max-width:none; flex:0 0 auto; width:min(640px,52%); display:flex; flex-direction:column;
               box-shadow:-10px 0 34px rgba(0,0,0,.4); z-index:6}
  .win.dockwin .tabpane{flex:1 1 auto; overflow-y:auto; min-height:0; padding:14px}
  .win.dockwin .tabpane.fill{padding:0; overflow:hidden; display:flex; flex-direction:column}
  /* Äußeres vvvv-gamma-Fenster: feste Höhe bis unten, Dock-Spalte füllt sie */
  .win.vvvvwin{height:max(560px, calc(100vh - 190px)); display:flex; flex-direction:column}
  .win.vvvvwin>div:not(.win-title){flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
  .win.vvvvwin .app{flex:1 1 auto; min-height:0}
  .win.vvvvwin .win-title{flex:0 0 auto}
  /* ---------- Version 2: dockbare Fenster ---------- */
  .v2bar{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:8px; font-size:11.5px}
  .v2bar .lbl{color:var(--faint); margin-right:4px}
  .v2bar button{background:none; border:1px solid var(--border2); color:var(--muted); padding:3px 10px; cursor:pointer; font-family:inherit; font-size:11.5px}
  .v2bar button:hover{color:var(--text)}
  .v2bar button.on{background:var(--panel3); color:var(--text); border-color:var(--accent)}
  .v2root{display:flex; flex:1 1 auto; min-height:0; min-width:0; position:relative}
  .vsplit{display:flex; flex:1 1 auto; min-width:0; min-height:0}
  .vstack{display:flex; flex-direction:column; flex:1 1 auto; min-width:0; min-height:0; background:var(--panel2); border-left:1px solid var(--border2)}
  .vstack .vhead{flex:0 0 auto; cursor:grab; user-select:none}
  .vstack .vhead .wclose{cursor:pointer}
  .vstack>.vbody{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
  .vstack>.btabs{flex:0 0 auto}
  .vcol{flex:1 1 auto; min-height:0; min-width:0; display:flex; flex-direction:column; position:relative; overflow:hidden}
  .vcol>.tabpane{flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px}
  .vcol>.tabpane.fill{overflow:hidden; padding:0; display:flex; flex-direction:column}
  .vhl{position:fixed; z-index:80; pointer-events:none; background:rgba(240,162,50,.16); border:2px solid var(--accent)}
  .fswitch{display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel); font-size:12px; flex:0 0 auto}
  .fswitch .fl{font-weight:600; color:var(--text)}
  .fswitch .fhint{color:var(--faint); font-size:11px}
  .fswitch .switch{margin-left:auto; width:36px; height:18px; border-radius:9px; background:var(--panel3); border:1px solid var(--border2); position:relative; cursor:pointer; padding:0; flex:0 0 auto}
  .fswitch .switch i{position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--faint); transition:left .15s}
  .fswitch .switch.on{background:var(--green); border-color:var(--green)}
  .fswitch .switch.on i{left:20px; background:#fff}
  .setv2 .sg-h{font-weight:600; font-size:13px; color:var(--text); margin:6px 0 6px}
  .setv2 .grp{font-weight:600; font-size:13px; color:var(--text); margin:18px 0 6px}

   Echte Pack-Daten (data.js — erzeugt von tools/scripts/fetch_packs.py)
   ===================================================================== */
const PD = window.PACK_DATA || {indexedAt:"—", shipped:[], packs:[]};
const SHIPPED = PD.shipped || [];
const REAL = {}; PD.packs.forEach(p=>REAL[p.i]=p);

/* nuget-Kategorie → Prototyp-Kategorie */
function catKeyOf(cats, tags){
  const s = (cats||[]).concat(tags||[]).join(" ").toLowerCase();
  if(/vision|image|opencv|camera|video|recognition|detection|machine/.test(s)) return "vision";
  if(/graphic|render|draw|svg|skia|2d|3d|shader|color/.test(s)) return "graphics";
  if(/audio|sound|media|music|stream/.test(s)) return "media";
  if(/\bui\b|gui|window|control|widget|avalonia|interface/.test(s)) return "ui";
  if(/io|serial|mqtt|osc|device|hardware|network|http|socket|binding/.test(s)) return "io";
  return "tools";
}
const fmtDl = n => n>=1e6 ? (n/1e6).toFixed(1).replace(".",",")+"M"
                 : n>=1000 ? Math.round(n/1000)+"k" : String(n||0);
function relTime(ms){
  if(!ms) return "";
  const d = (Date.now()-ms)/86400000;
  if(d<1) return "heute";
  if(d<2) return "gestern";
  if(d<45) return `vor ${Math.round(d)} Tagen`;
  if(d<400) return `vor ${Math.round(d/30)} Monaten`;
  return `vor ${(d/365).toFixed(1).replace(".",",")} Jahren`;
}
/* Echten Datensatz → Pack-Objekt für den Pack-Browser */
function realPackObj(r, ico){
  const vers = (r.vs&&r.vs.length) ? r.vs : [r.v];
  return {
    id:r.i, n:r.i, ico:ico||"▣", author:r.a||"vvvv",
    cat:catKeyOf(r.c, r.t),
    catLabel:(r.c&&r.c[0])||"nuget",
    v:r.v, vers, dl:fmtDl(r.dl), dlN:r.dl||0,
    upd:relTime(r.lp), updRank:r.lp?Math.round((Date.now()-r.lp)/86400000):9999,
    addedDays:r.fp?Math.round((Date.now()-r.fp)/86400000):9999,
    fav:false, shipped:SHIPPED.includes(r.i),
    helpCount:(r.h||[]).length,
    refCount:(r.h||[]).filter(e=>e[0]==="ref").length,
    d:r.d||"", tags:(r.t||[]).slice(0,4), help:r.h||[], readme:null
  };
}
/* Readme für rein echte Packs (aus Katalogdaten generiert) */
function realReadme(p){
  return `<h1>${p.n}</h1><span class="rbadge">nuget</span><span class="rbadge">v${p.v}</span>
<span class="rbadge">${p.author}</span>${p.shipped?'<span class="rbadge">Built-In</span>':''}
<p>${p.d||"Keine Beschreibung hinterlegt."}</p>
<h2>Metadaten</h2>
<ul><li>Downloads: ${p.dl}</li><li>Help-Patches: ${p.helpCount}</li>
<li>Tags: ${(p.tags||[]).join(", ")||"—"}</li></ul>`;
}

/* Volltextsuche: Treffer im Titel hervorheben */
function hlText(text, q){
  if(!q) return text;
  const idx = text.toLowerCase().indexOf(q);
  if(idx<0) return text;
  return text.slice(0,idx)+'<span class="hit">'+text.slice(idx,idx+q.length)+'</span>'+text.slice(idx+q.length);
}

/* Help-Eintrag aus einem Pack, das noch nicht auf der Festplatte ist:
   Ladebalken in der Zeile → beim Fertigsein direkt öffnen.
   Der Zustand wird nicht vorab angezeigt — er erscheint erst beim Benutzen. */
function helpDownload(i, row){
  if(state.helpDl) return;
  const icon = row.querySelector(".ei");
  icon.innerHTML = `<span class="dlbar"><span class="track"><i></i></span><span class="pct">0%</span></span>`;
  const bar = icon.querySelector(".dlbar");
  let p = 0, timer = null;
  const fail = ()=>{
    clearInterval(timer); timer=null; state.helpDl=null;
    bar.classList.add("err");
    bar.querySelector(".pct").textContent = "↻";
    bar.title = "Download fehlgeschlagen — klicken zum Wiederholen";
    bar.onclick = ()=>{ bar.classList.remove("err"); bar.title=""; bar.onclick=null; start(); };
  };
  const start = ()=>{
    state.helpDl = i.pack; p = 0;
    timer = setInterval(()=>{
      if(!navigator.onLine){ fail(); return; }
      p = Math.min(100, p + 8 + Math.random()*10);
      bar.querySelector("i").style.width = p+"%";
      bar.querySelector(".pct").textContent = Math.round(p)+"%";
      if(p>=100){
        clearInterval(timer); timer=null; state.helpDl=null;
        if(!installedPacks().includes(i.pack)) state.installed = installedPacks().concat([i.pack]);
        icon.innerHTML = "✓";
        toast(`${i.pack} heruntergeladen — öffne: ${i.t}`);
      }
    }, 90);
  };
  start();
}

let helpDlTimer = null;
/* Download eines ganzen Packs aus dem Help-Browser: der Balken gehört zum Pack
   (Sidebar-Zeile + Pack-Kopf). Danach ist das Pack grün und alle Einträge öffnen direkt. */
function helpPackDl(pk){
  if(state.helpDl) return;
  state.helpDl = pk; state.helpPct = 0; state.helpErr = null;
  clearInterval(helpDlTimer);
  helpDlTimer = setInterval(()=>{
    if(!navigator.onLine){
      clearInterval(helpDlTimer); helpDlTimer = null;
      state.helpDl = null; state.helpErr = pk; render();
      toast(`${pk}: Download fehlgeschlagen — erneut versuchen`);
      return;
    }
    state.helpPct = Math.min(100, state.helpPct + 8 + Math.random()*10);
    document.querySelectorAll(`[data-dl="${pk}"] i`).forEach(b=>b.style.width = state.helpPct+"%");
    document.querySelectorAll(`[data-dl="${pk}"] .pct`).forEach(p=>p.textContent = Math.round(state.helpPct)+"%");
    if(state.helpPct>=100){
      clearInterval(helpDlTimer); helpDlTimer = null;
      state.helpDl = null;
      state.installed = installedPacks().concat([pk]);
      render();
      toast(state.helpWant ? `${pk} geladen — öffnet „${state.helpWant}“` : `${pk} geladen`);
    }
  }, 90);
}

      const on = state.helpTypes.includes(k);
      const n = textHits.filter(i=>i.k===k).length;
      const b = row(on?"on":"", `<span class="tdot ${k}"></span><span class="nm">${l}${k==="ref"?" ↗":""}</span><span class="n">${n}</span>`, ()=>{
        if(k==="ref" && isHot("filter-greybook")){
          window.open("https://greybook.vvvv.org","_blank","noopener");
          flowAdvance("filter-greybook");
          toast("Öffnet greybook.vvvv.org — die echte Dokumentation");
          return;
        }
        state.helpTypes = on ? state.helpTypes.filter(x=>x!==k) : state.helpTypes.concat([k]);
        state.helpView = "pack";
        render();
      });
      if(k==="ref" && isHot("filter-greybook")) hot(b,"filter-greybook");
      types.appendChild(b);
    });
    types.appendChild(el("div","sg","Mehr"));
    [["shortcuts","Shortcuts"],["community","Community & Links"]].forEach(([k,l])=>{
      types.appendChild(row(state.helpView===k?"on":"", `<span class="nm">${l}</span>`,
        ()=>{ state.helpView = state.helpView===k ? "pack" : k; render(); }));
    });

    /* Sidebar · Packs (Sprungmarken) */
    packList.innerHTML = "";
    packList.appendChild(el("div","sg",`Packs · ${groups.length}`));
    groups.forEach(g=>{
      const inst = installedPacks().includes(g.pack);
      let tail = `<span class="n">${g.items.length}</span>`;
      if(state.helpDl===g.pack) tail = `<span class="dlx" data-dl="${g.pack}"><span class="mini"><i style="width:${state.helpPct}%"></i></span><span class="pct">${Math.round(state.helpPct)}%</span></span>`;
      else if(state.helpErr===g.pack) tail = `<span class="n" style="color:#e8a49c">↻ Erneut</span>`;
      const b = el("button", "pkb"+(inst?" in":""));
      b.dataset.pk = g.pack;
      b.innerHTML = `<span class="sdot${inst?" ok":""}"></span><span class="nm">${g.pack}</span>${tail}`;
      if(g.pack==="2D.Voronoi" && isHot("filter-pack")) hot(b,"filter-pack");
      b.onclick = ()=>{
        if(state.helpErr===g.pack){ state.helpErr = null; helpPackDl(g.pack); render(); return; }
        if(state.helpView!=="pack"){ state.helpView = "pack"; state.helpJump = g.pack; render(); return; }
        jumpTo(g.pack);
        if(g.pack==="2D.Voronoi") flowAdvance("filter-pack");
      };
      packList.appendChild(b);
    });

    if(state.helpView!=="pack"){
      meta.innerHTML = "";
      sc.innerHTML = "";
      sc.appendChild(state.helpView==="shortcuts" ? helpShortcutsEl() : helpCommunityEl());
      updateActive();
      return;
    }

    /* Hauptbereich · Meta + gruppierte Liste mit klebenden Pack-Köpfen */
    meta.innerHTML = `<div style="font-size:10.5px;color:var(--faint)">${q
        ? `${items.length} Treffer in ${groups.length} Packs`
        : `${groups.length} Packs · ${items.length} Einträge`}${state.helpTypes.length ? ` · ${state.helpTypes.length} Typ${state.helpTypes.length>1?"en":""}` : ""}</div>`;

    sc.innerHTML = "";
    if(!items.length) sc.appendChild(el("div","emptybox","Keine Treffer für diesen Filter."));
    groups.forEach(g=>{
      const inst = installedPacks().includes(g.pack);
      const info = helpPackInfo(g.pack);
      const h = el("div","pkh"+(inst?" in":""));
      h.dataset.pk = g.pack;
      h.innerHTML = `<span class="pkn">${hlText(g.pack,q)}</span><span class="pkc">${g.items.length}</span>
        <span class="pka">${info.author} · ${info.version}</span><span class="pkx"></span>`;
      const x = h.querySelector(".pkx");
      if(state.helpDl===g.pack) x.innerHTML = `<span class="dlx" data-dl="${g.pack}"><span class="mini"><i style="width:${state.helpPct}%"></i></span><span class="pct">${Math.round(state.helpPct)}%</span></span>`;
      else if(state.helpErr===g.pack){
        const rt = el("button","btn sm","↻ Erneut");
        rt.onclick = ()=>{ state.helpErr = null; helpPackDl(g.pack); render(); };
        x.appendChild(rt);
      }
      const rb = el("button","btn sm","Readme");
      rb.onclick = ()=>{
        if(info.id && DIS_BY_ID(info.id)?.readme){
          state.discDetail = info.id; goto("neu-packs");
          toast(`Readme von ${g.pack} geöffnet`);
        } else toast(`Readme von ${g.pack} folgt`);
      };
      x.appendChild(rb);
      sc.appendChild(h);

      const secOrder = [], bySec = {};
      g.items.forEach(i=>{
        const s = helpSectionOf(i);
        if(!bySec[s]){ bySec[s]=[]; secOrder.push(s); }
        bySec[s].push(i);
      });
      secOrder.forEach(s=>{
        sc.appendChild(el("div","hsec",s));
        const box = el("div","hentries");
        bySec[s].forEach(i=>{
          const a = el("button","hentry");
          const yt = i.m.includes("▶") || i.m.includes("YouTube");
          const busy = state.helpDl===i.pack;
          a.innerHTML = `<span class="tdot ${i.k}"></span><span class="et">${hlText(i.t,q)}</span>
            <span class="ei">${busy?"lädt …":(yt?"▶":"📄")}</span>`;
          a.onclick = ()=>{
            if(i.gw){ window.open("https://greybook.vvvv.org","_blank","noopener");
                      toast("Öffnet greybook.vvvv.org — die echte Dokumentation"); return; }
            if(inst){ toast(`Öffnet: ${i.t}`); return; }
            if(state.helpDl){ toast(`${state.helpDl} lädt bereits …`); return; }
            state.helpWant = i.t;
            helpPackDl(i.pack);
            render();
          };
          box.appendChild(a);
        });
        sc.appendChild(box);
      });
    });
    if(!isV2()) sc.appendChild(featureCard());
    updateActive();
  };

  redraw();
  /* Scrollposition erst nach dem Einhängen setzen (Layout existiert vorher nicht) */
  requestAnimationFrame(()=>{
    if(state.helpJump){ const pk = state.helpJump; state.helpJump = null; jumpTo(pk); }
    else sc.scrollTop = state.helpScroll || 0;
    updateActive();
  });

  wrap.appendChild(winShell("vvvv gamma", editorShell(dockColumn("browser", browserShell("help", pane)))));
  return wrap;
}

function neuHelpOld(){
  const wrap = el("div");
  const pane = el("div","hbpane");
  const c = el("div");            /* Filterzeile, klebt fest */
  const sc = el("div","hbscroll");/* nur dieser Bereich scrollt */

  /* Filterzeile: FILTER BY (Volltext) · Typ-Chips · Pack ▾ */
  const fb = el("div","pbar");
  const sbox = el("span","");
  sbox.style.cssText = "display:flex;align-items:center;gap:5px;flex:1 1 190px;min-width:150px";
  const search = el("input","fsearch");
  search.placeholder = "FILTER BY …";
  search.value = state.helpSearch;
  search.dataset.flow = "help-search";
  if(isHot("help-search")) search.classList.add("hot");
  const clr = el("button","chip","✕");
  clr.title = "Suche leeren";
  clr.style.display = state.helpSearch ? "" : "none";
  if(isHot("help-clear")) hot(clr,"help-clear");
  clr.onclick = ()=>{ state.helpSearch=""; if(!flowAdvance("help-clear")) render(); };
  search.oninput = e=>{
    state.helpSearch = e.target.value;
    clr.style.display = state.helpSearch ? "" : "none";
    if(flowAdvance("help-search")) return;
    redraw();
  };
  sbox.appendChild(search);
  sbox.appendChild(clr);
  fb.appendChild(sbox);

  const noTypes = !state.helpTypes.length;
  const allBtn = el("button","chip"+(noTypes?" on":""),"Alle");
  allBtn.onclick = ()=>{ state.helpTypes=[]; render(); };
  fb.appendChild(allBtn);
  HELP_TYPES.forEach(([k,l])=>{
    const on = state.helpTypes.includes(k);
    const b = el("button","chip"+(on?" on":""));
    b.innerHTML = `<span class="tdot ${k}"></span>${l}${k==="ref"?" ↗":""}`;
    b.onclick = ()=>{
      if(k==="ref" && isHot("filter-greybook")){
        window.open("https://greybook.vvvv.org","_blank","noopener");
        flowAdvance("filter-greybook");
        toast("Öffnet greybook.vvvv.org — die echte Dokumentation");
        return;
      }
      state.helpTypes = on ? state.helpTypes.filter(x=>x!==k) : state.helpTypes.concat([k]);
      render();
    };
    if(k==="ref" && isHot("filter-greybook")) hot(b,"filter-greybook");
    fb.appendChild(b);
  });
  const pg = el("span","");
  pg.style.cssText = "margin-left:auto;display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--faint)";
  pg.innerHTML = "Pack ▾";
  const sel = el("select","psel");
  const packOpts = [["all","Alle Packs"]]
    .concat([...new Set(HELP_ITEMS.map(i=>i.pack))].map(n=>["pack:"+n, n]));
  sel.innerHTML = packOpts.map(([v,l])=>`<option value="${v}"${state.helpPack===v?" selected":""}>${l}</option>`).join("");
  sel.onchange = ()=>{
    state.helpPack = sel.value;
    if(sel.value!=="all" && flowAdvance("filter-pack")) return;
    render();
  };
  if(isHot("filter-pack")) hot(sel,"filter-pack");
  pg.appendChild(sel);
  fb.appendChild(pg);
  c.appendChild(fb);

  const meta = el("div","hmeta");
  c.appendChild(meta);

  /* Feature-Entdeckung — wird bei jedem Neuzeichnen mit eingehängt */
  const featureCard = ()=>{
    const f = el("div","card");
    f.innerHTML = `<div class="t">Follow-Mode &amp; Node-Info</div>
      <div class="d">Selektiere ein Node → siehe, in welchen Help-Patches es vorkommt.
        <div id="followBody" style="display:${state.followOpen?"block":"none"};margin-top:7px;color:#b9d9f3;border-top:1px dashed var(--border2);padding-top:7px">
        So findest du Beispiel-Patches für genau den Knoten, den du gerade verstehen willst —
        ohne zu wissen, welches Pack ihn enthält. (Im Ist: Sub-Tab „Follow-Mode“ und Rechtsklick → Node Info [05:59])</div></div>`;
    const fbtn = el("button","btn sm", state.followOpen?"Erklärung ausblenden":"Follow-Mode erklären");
    fbtn.style.marginTop="8px";
    fbtn.onclick = ()=>{
      state.followOpen=!state.followOpen;
      if(!flowAdvance("follow-card")) render();
    };
    if(isHot("follow-card")) hot(fbtn,"follow-card");
    f.appendChild(fbtn);
    const h = el("div","h2","Features, die du kennen solltest");
    const box = el("div","");
    box.appendChild(h); box.appendChild(f);
    return box;
  };

  /* Inhalt neu zeichnen — die Filterzeile bleibt dabei unangetastet (Suchfokus bleibt) */
  const redraw = ()=>{
    const q = state.helpSearch.trim().toLowerCase();
    const typeOk = i => !state.helpTypes.length || state.helpTypes.includes(i.k);
    const textOk = i => !q || (i.t+" "+i.m+" "+i.pack).toLowerCase().includes(q);
    const packOk = i => state.helpPack==="all" || i.pack===state.helpPack.slice(5);
    const items = HELP_ITEMS.filter(i=>typeOk(i)&&textOk(i)&&packOk(i));
    const groups = [];
    items.forEach(i=>{
      let g = groups.find(x=>x.pack===i.pack);
      if(!g){ g = {pack:i.pack, items:[]}; groups.push(g); }
      g.items.push(i);
    });

    const extra = (state.helpTypes.length ? ` · ${state.helpTypes.length} Typ${state.helpTypes.length>1?"en":""}` : "")
                + (state.helpPack!=="all" ? ` · ${state.helpPack.slice(5)}` : "");
    meta.innerHTML = `<div style="font-size:10.5px;color:var(--faint)">${q
        ? `${items.length} Treffer in ${groups.length} Packs`
        : `${groups.length} Packs · ${items.length} Einträge`}${extra}</div>`;

    sc.innerHTML = "";
    if(!items.length){
      sc.appendChild(el("div","emptybox","Keine Treffer für diesen Filter."));
      sc.appendChild(featureCard());
      return;
    }

    /* Pack-Index mit Inline-Accordion: ein Klick klappt die Einträge unter der Zeile auf —
       keine eigene Seite, kein „‹ Alle Packs“. Bei Suche sind alle Treffer-Gruppen offen. */
    const openName = state.helpPack!=="all" ? state.helpPack.slice(5) : state.helpOpen;
    groups.forEach(g=>{
      const info = helpPackInfo(g.pack);
      const isOpen = !!q || g.pack===openName;
      const b = el("button","hindex"+(installedPacks().includes(g.pack)?" in":""));
      b.innerHTML = `<span class="car">${isOpen?"▾":"▸"}</span><span class="nm">${hlText(g.pack,q)}</span>
        <span class="n">${g.items.length}</span><span class="d">${info.desc}</span>`;
      b.onclick = ()=>{
        state.helpOpen = (isOpen && !q) ? null : g.pack;
        if(state.helpPack!=="all") state.helpPack = "all";
        render();
      };
      sc.appendChild(b);
      if(!isOpen) return;

      /* Eingeklappter Detailbereich direkt unter der Index-Zeile */
      const head = el("div","pkhead");
      head.innerHTML = `<div class="m">${g.pack}<br>Authors: ${info.author}<br>Version: ${info.version}</div>`;
      const rb = el("button","btn sm","Readme");
      rb.onclick = ()=>{
        if(info.id && DIS_BY_ID(info.id)?.readme){
          state.discDetail = info.id; goto("neu-packs");
          toast(`Readme von ${g.pack} geöffnet`);
        } else toast(`Readme von ${g.pack} folgt`);
      };
      head.appendChild(rb);
      sc.appendChild(head);

      const secOrder = [], bySec = {};
      g.items.forEach(i=>{
        const s = helpSectionOf(i);
        if(!bySec[s]){ bySec[s]=[]; secOrder.push(s); }
        bySec[s].push(i);
      });
      secOrder.forEach(s=>{
        sc.appendChild(el("div","hsec",s));
        const box = el("div","hentries");
        bySec[s].forEach(i=>{
          const a = el("button","hentry");
          const yt = i.m.includes("▶") || i.m.includes("YouTube");
          a.innerHTML = `<span class="tdot ${i.k}"></span><span class="et">${hlText(i.t,q)}</span>
            <span class="ei">${yt?"▶":"📄"}</span>`;
          a.onclick = ()=>{
            if(i.gw){ window.open("https://greybook.vvvv.org","_blank","noopener");
                      toast("Öffnet greybook.vvvv.org — die echte Dokumentation"); return; }
            if(installedPacks().includes(i.pack)){ toast(`Öffnet: ${i.t}`); return; }
            helpDownload(i, a);
          };
          box.appendChild(a);
        });
        sc.appendChild(box);
      });
    });
    sc.appendChild(featureCard());
  };

  redraw();

  pane.appendChild(c);
  pane.appendChild(sc);
  wrap.appendChild(winShell("vvvv gamma", editorShell(dockColumn("browser", browserShell("help", pane)))));
  return wrap;
}

/* Installation: kurzer Fortschritt, danach sofort Help-Patches sichtbar */
function installPack(p){
  if(installedPacks().includes(p.n)) return;
  state.installing = p.id;
  render();
  clearTimeout(installTimer);

   dl:"—", dlN:0, upd:"Built-In", updRank:9, addedDays:0, fav:true, helpCount:12, refCount:0,

];
/* Packs mit ausstehendem Update → Version davor (Anzeige „alt → neu“).
   Echte Versionen: installiert1.2.6 / 0.7.6 → Katalog 1.3.0 / 0.7.7 */
const UPDATES = {"VL.IO.MQTT":"1.2.6", "VL.Avalonia":"0.7.6"};

/* Kuratierte Einträge (DISCOVER/PACK_EXTRA) mit den echten Katalogwerten angereichert,
   plus alle übrigen nuget-Packs — EIN gemeinsamer Bestand für Browser und Help. */
const CATALOG = (()=>{
  const byName = {};
  PD.packs.forEach(r=>{ byName[r.i] = r; });
  const cur = DISCOVER.concat(PACK_EXTRA).map(p=>{
    const r = byName[p.n];
    if(!r) return p;
    const vers = (r.vs&&r.vs.length) ? r.vs : [r.v];
    const o = Object.assign({}, p, {
      v:r.v, vers, dl:fmtDl(r.dl), dlN:r.dl||0,
      upd:relTime(r.lp) || p.upd, updRank:p.updRank,
      helpCount:(r.h||[]).length,
      refCount:(r.h||[]).filter(e=>e[0]==="ref").length,
      shipped:SHIPPED.includes(p.n),
      d:r.d||p.d, tags:(r.t||[]).slice(0,4)
    });
    /* Readme-Badge auf die echte Version bringen */
    if(o.readme) o.readme = o.readme.replace(/(<span class="rbadge">v)[^<]+(<\/span>)/, `$1${r.v}$2`);
    return o;
  });
  const known = new Set(cur.map(p=>p.n));
  const rest = PD.packs.filter(r=>!known.has(r.i)).map(r=>{
    const p = realPackObj(r);
    p.readme = realReadme(p);
    return p;
  });
  return cur.concat(rest);
})();
const allPacks = ()=> CATALOG;
const isInstP = p => installedPacks().includes(p.n);
const updPending = p => !!UPDATES[p.n] && isInstP(p) && !state.updatesDone;
const verText = p => updPending(p) ? `${UPDATES[p.n]} → ${p.v}` : p.v;
const PACK_CAT_OPTS = [["all","Alle Kategorien"]].concat(DIS_CATS.slice(1),
  DIS_OWNERS.map(([k,l])=>["owner:"+k, "Herausgeber: "+l]));
const packSorter = sort => (a,b)=> sort==="downloads" ? b.dlN-a.dlN
  : sort==="added" ? a.addedDays-b.addedDays
  : sort==="favs" ? ((b.fav?1:0)-(a.fav?1:0)) || (b.dlN-a.dlN)
  : a.updRank-b.updRank;
function packMatch(p, ui){
  if(ui.chip==="fav" && !p.fav) return false;
  if(ui.cat.startsWith("owner:")){ if(p.author!==ui.cat.slice(6)) return false; }
  else if(ui.cat!=="all" && p.cat!==ui.cat) return false;
  const q = ui.search.trim().toLowerCase();
  return !q || (p.n+" "+p.author+" "+p.d).toLowerCase().includes(q);
}

/* „Add“ im Referenz-Overlay: erst herunterladen (Ladebalken in der Zeile), dann referenzieren.
   Auf der Festplatte → sofort, ohne Balken. */
function refDownload(p, row, act, done){
  if(row._dl) return;
  let pc = 0, timer = null;
  const stop = ()=>{ clearInterval(timer); timer=null; row._dl=false; row.classList.remove("dl");
                     row.querySelector(".rowbar")?.remove(); };
  const start = ()=>{
    row._dl = true; pc = 0; row.classList.add("dl");
    let host = row.querySelector(".rowbar");
    if(!host){ row.insertAdjacentHTML("beforeend",'<span class="rowbar"><i></i></span>');
               host = row.querySelector(".rowbar"); }
    const bar = host.querySelector("i");
    bar.style.cssText = ""; bar.style.width = "0%";
    act.innerHTML = `<span class="dlbar" style="min-width:0"><span class="pct">0%</span>
      <button class="x" title="Abbrechen">✕</button></span>`;
    const pct = act.querySelector(".pct");
    act.querySelector(".x").onclick = e=>{
      e.stopPropagation(); stop(); render(); toast("Download abgebrochen");
    };
    timer = setInterval(()=>{
      if(!navigator.onLine){ stop(); showError(); return; }
      pc = Math.min(100, pc + 8 + Math.random()*10);
      bar.style.width = pc+"%"; pct.textContent = Math.round(pc)+"%";
      if(pc>=100){ stop(); done(); }
    }, 100);
  };
  const showError = ()=>{
    row.classList.add("dl"); row._dl = false;
    row.insertAdjacentHTML("beforeend",'<span class="rowbar"><i style="width:100%;background:var(--red)"></i></span>');
    act.innerHTML = `<span class="dlbar err" style="min-width:0"><span class="pct">↻</span>
      <button class="x">Erneut</button></span>`;
    act.querySelector(".x").onclick = e=>{
      e.stopPropagation();
      row.querySelector(".rowbar")?.remove(); row.classList.remove("dl");
      start();
    };
  };
  start();
}

function packBrowser(mode, cb={}){
  const ref = mode==="ref";
  const key = ref ? "refUI" : "packUI";
  if(!state[key]) state[key] = {search:"", chip:"all", cat:"all", sort: ref?"downloads":"updated",
                                collapsed:{av:true}, view:"list"};
  const ui = state[key];

  /* References-Modus: Packs des Dokuments + MQTT, sobald hinzugefügt */
  const d = DOCS[state.doc];
  const refNames = ref ? (d ? d.packs.map(p=>p.n) : []).concat(state.refExtra||[])
    .concat(state.packAdded && !state.removed ? ["VL.IO.MQTT"] : []) : [];
  const inDoc = p => refNames.includes(p.n);

  const wrap = el("div");
  const bar = el("div","pbar");
  bar.innerHTML = `<span style="flex:1 1 180px;display:flex;align-items:center;gap:4px"><input class="fsearch" placeholder="FILTER BY …" value="${ui.search}"><button class="chip" id="pClr" title="Suche leeren" style="${ui.search?"":"display:none"}">✕</button></span>
    <select class="psel" id="pSort">${SORTS.map(([k,l])=>
      `<option value="${k}"${ui.sort===k?" selected":""}>${l}</option>`).join("")}</select>
    <span class="vtog" id="pView"><button data-v="list" class="${ui.view==="list"?"on":""}" title="Liste">☰</button><button data-v="card" class="${ui.view==="card"?"on":""}" title="Karten">▦</button></span>
    <label class="pstable"><input type="checkbox" checked style="margin:0"> Only Stable</label>`;
  wrap.appendChild(bar);
  const body = el("div","pbody");
  const side = el("div","pside");
  const list = el("div","plist");
  body.appendChild(side);
  body.appendChild(list);
  wrap.appendChild(body);

  /* Sektionen: Länge steuern — Updates/Installiert offen, „Verfügbar“ als Akkordeon */
  const base = allPacks();
  const sections = ref
    ? [["all","",()=>true]]
    : [["upd","Updates",p=>updPending(p)],
       ["inst","Installiert",p=>isInstP(p) && !updPending(p)],
       ["av","Verfügbar · nuget.org",p=>!isInstP(p)]];

  const packRow = p=>{
    const pend = updPending(p);
    const inst = isInstP(p);
    const isIn = ref ? inDoc(p) : inst;
    const busy = state.installing===p.id;
    const row = el("div","prow shot"+(isIn && !pend ? " in" : ""));
    const dotCls = pend ? "upd" : busy ? "busy" : isIn ? "ok" : "";
    const vers = (p.vers && p.vers.length) ? p.vers : [p.v];
    const stateTxt = ref
      ? (isIn ? "✓ im Dokument" : "")
      : pend ? "⬆ Update verfügbar"
      : busy ? "wird installiert …"
      : inst ? "✓ installiert" : "nicht installiert";
    row.innerHTML = `<span class="sq">${p.ico||"▣"}</span>
      <div class="info">
        <div class="nm">${p.n}${p.shipped?' <span class="badge bi">Built-In</span>':""}</div>
        <div class="au">${p.author||"vvvv"}${p.catLabel?" · "+p.catLabel:""}</div>
        <div class="dsc">${p.d||""}</div>
        ${(p.tags&&p.tags.length)?`<div class="tags">${p.tags.map(t=>`<span class="tg">${t}</span>`).join("")}</div>`:""}
      </div>
      <div class="side">
        <div class="l1">
          <span class="sdot ${dotCls}"></span><span class="stt">${stateTxt}</span>
          <button class="helpico" title="Help-Patches anzeigen">📄</button>
          <button class="more" title="Mehr Aktionen">⋯</button>
          <button class="star${p.fav?" on":""}" title="Favorit">${p.fav?"★":"☆"}</button>
        </div>
        <div class="l2">
          <span class="ver">${ref
            ? `<select>${vers.map(v=>`<option${v===p.v?" selected":""}>${v}</option>`).join("")}</select>`
            : `<span style="color:var(--muted);font-size:10.5px;white-space:nowrap">${verText(p)}</span>`}</span>
          <span class="dl">${p.dl}</span>
          <span class="act"></span>
        </div>
      </div>`;
    row.querySelector(".star").onclick = e=>{ e.stopPropagation(); p.fav=!p.fav; drawList(); };
    row.querySelector(".more").onclick = e=>{
      e.stopPropagation();
      toast(`${p.n}: Details · Versionen · Abhängigkeiten · NuGet-Seite öffnen`);
    };
    row.querySelector(".helpico").onclick = e=>{
      e.stopPropagation();
      state.helpTypes=[]; state.helpPack="pack:"+p.n; state.helpOpen=p.n; state.helpSearch="";
      goto("neu-help");
      toast(`Help-Patches von ${p.n} — ${p.helpCount||0} Einträge`);
    };
    const act = row.querySelector(".act");
    const sel = row.querySelector("select");
    if(sel) sel.onchange = e=>{ e.stopPropagation(); toast(`Version ${e.target.value} gewählt — greift beim nächsten Refresh`); };

    if(ref){
      if(inDoc(p)){
        if(p.n==="VL.IO.MQTT"){
          const rb = el("button","btn sm","Remove");
          rb.id = "ovRemove";
          rb.onclick = e=>{ e.stopPropagation(); cb.onRemove && cb.onRemove(); };
          act.appendChild(rb);
        }
      } else {
        const ab = el("button","btn sm","Add to Document");
        const finish = ()=>{
          state.refExtra = (state.refExtra||[]).concat([p.n]);
          if(!installedPacks().includes(p.n)) state.installed = installedPacks().concat([p.n]);
          if(!(p.id==="opencv" && flowAdvance("pack-download"))) render();
          toast(`${p.n} → jetzt referenziert`);
        };
        if(p.n==="VL.IO.MQTT"){
          ab.id = "addMqtt";
          ab.dataset.flow = "pack-add";
          if(isHot("pack-add")) ab.classList.add("hot");
          ab.onclick = e=>{ e.stopPropagation(); cb.onAdd && cb.onAdd(); };
        } else {
          if(p.id==="opencv" && isHot("pack-download")) hot(ab,"pack-download");
          ab.onclick = e=>{ e.stopPropagation();
            installedPacks().includes(p.n) ? finish() : refDownload(p, row, act, finish); };
        }
        act.appendChild(ab);
      }
    } else {
      if(pend){
        const ub = el("button","btn sm","⬆ Update");
        ub.onclick = e=>{ e.stopPropagation(); installPack(p); };
        act.appendChild(ub);
      }
      else if(inst) act.innerHTML = `<span style="color:var(--green);font-size:11px">✓ installiert</span>`;
      else if(busy) act.innerHTML = `<span class="spin"></span>`;
      else {
        const ib = el("button","btn sm","Installieren");
        ib.onclick = e=>{ e.stopPropagation(); installPack(p); };
        act.appendChild(ib);
      }
      /* Zeile öffnet das Readme */
      row.style.cursor = "pointer";
      row.onclick = e=>{
        if(e.target.closest(".act,.star,.more,.helpico,.l2 select")) return;
        if(!p.readme){ toast(`${p.n}: Readme folgt`); return; }
        state.discDetail = p.id;
        if(!(p.id==="opencv" && flowAdvance("disc-card"))) render();
      };
      if(p.id==="opencv" && isHot("disc-card")) hot(row,"disc-card");
    }
    return row;
  };

  const drawList = ()=>{
    list.className = "plist" + (ui.view==="card" ? " pcards" : "");
    list.innerHTML = "";
    const rows = base.filter(p=>packMatch(p, ui));
    if(!rows.length){ list.appendChild(el("div","emptybox","Keine Treffer für diesen Filter.")); return; }
    sections.forEach(([sk, title, test])=>{
      const items = rows.filter(test).sort(packSorter(ui.sort));
      if(!items.length) return;
      /* References: flache Liste aller Packs — kein Abschnittskopf, Aktion je Zeile */
      if(ref){ items.forEach(p=>list.appendChild(packRow(p))); return; }
      const closed = !!ui.collapsed[sk];
      const h = el("div","sect");
      h.innerHTML = `<span class="car">${closed?"▸":"▾"}</span>${title} <span class="cnt">(${items.length})</span>`;
      h.onclick = ()=>{ ui.collapsed[sk] = !closed; drawList(); };
      if(sk==="upd" && !state.updatesDone){
        const ub = el("button","btn sm","Alle Updates installieren");
        ub.style.marginLeft = "auto";
        if(isHot("update-all")) hot(ub,"update-all");
        ub.onclick = e=>{
          e.stopPropagation();
          state.updatesDone = true;
          if(!flowAdvance("update-all")) render();
          toast("2 Packs aktualisiert: VL.IO.MQTT → 1.3.0, VL.Avalonia → 0.7.7");
        };
        h.appendChild(ub);
      }
      list.appendChild(h);
      if(!closed) items.forEach(p=>list.appendChild(packRow(p)));
    });
  };

  bar.querySelector(".fsearch").oninput = e=>{
    ui.search = e.target.value;
    bar.querySelector("#pClr").style.display = ui.search ? "" : "none";
    drawList();
  };
  bar.querySelector("#pClr").onclick = ()=>{
    ui.search = ""; bar.querySelector(".fsearch").value = "";
    bar.querySelector("#pClr").style.display = "none"; drawList();
  };
  bar.querySelector("#pSort").onchange = e=>{ ui.sort = e.target.value; drawList(); };
  bar.querySelectorAll("#pView button").forEach(b=>{
    b.onclick = ()=>{
      ui.view = b.dataset.v;
      bar.querySelectorAll("#pView button").forEach(x=>x.classList.toggle("on", x===b));
      drawList();
    };
  });
  /* Sidebar wie in vvvv: All/Favorites, dann Kategorien oder Herausgeber */
  const drawAll = ()=>{ drawSide(); drawList(); };
  const drawSide = ()=>{
    const all = allPacks();
    side.innerHTML = "";
    const item = (on, label, n, fn)=>{
      const b = el("button", "pitem"+(on?" on":""));
      b.innerHTML = `<span class="nm">${label}</span><span class="n">${n}</span>`;
      b.onclick = fn;
      side.appendChild(b);

    item(ui.chip==="fav", "Favorites", all.filter(p=>p.fav).length, ()=>{ ui.chip="fav"; ui.cat="all"; drawAll(); });
    const seg = el("div","pseg");
    seg.innerHTML = `<button class="${ui.side!=="owner"?"on":""}">By Category</button><button class="${ui.side==="owner"?"on":""}">By Owner</button>`;
    seg.children[0].onclick = ()=>{ ui.side="cat"; drawSide(); };
    seg.children[1].onclick = ()=>{ ui.side="owner"; drawSide(); };
    side.appendChild(seg);
    if(ui.side==="owner"){
      DIS_OWNERS.forEach(([k,l])=>item(ui.cat==="owner:"+k, l, all.filter(p=>p.author===k).length,
        ()=>{ ui.cat="owner:"+k; ui.chip="all"; drawAll(); }));
    } else {
      DIS_CATS.slice(1).forEach(([k,l])=>item(ui.cat===k, l, all.filter(p=>p.cat===k).length,
        ()=>{ ui.cat=k; ui.chip="all"; drawAll(); }));
    }
  };
  drawSide();
  drawList();
  return wrap;
}

function startExtProgress(){
  clearInterval(extTimer);
  extTimer = setInterval(()=>{
    state.ext.pct += 8 + Math.random()*14;
    if(state.ext.pct>=100){
      state.ext.pct=100; clearInterval(extTimer);
      const bar=document.getElementById("extBar"); if(bar) bar.style.width="100%";
      const pct=document.getElementById("extPct"); if(pct) pct.textContent="Lädt von nuget.org … 100 %";
      setTimeout(()=>{
        state.ext.phase="done";
        if(!flowAdvance("ext-progress")) render();
        toast("Installiert — der Anker führt direkt zum Ergebnis");
      }, 350);
      return;
    }
    const bar=document.getElementById("extBar"); if(bar) bar.style.width=state.ext.pct+"%";
    const pct=document.getElementById("extPct"); if(pct) pct.textContent=`Lädt von nuget.org … ${Math.round(state.ext.pct)} %`;
  }, 260);
}

function versionSelect(name, cur){
  /* Echte Versionen aus dem nuget-Katalog (data.js), sonst die des Dokuments */
  const p = allPacks().find(x=>x.n===name);
  const opts = (p && p.vers && p.vers.length) ? p.vers.slice(0,6)
             : {"VL.CoreLib":["Built-In"]}[name] || [cur];
  const list = (cur && !opts.includes(cur)) ? [cur].concat(opts) : opts;
  return `<select class="vsel">${list.map(v=>`<option${v===cur?" selected":""}>${v}</option>`).join("")}</select>`;
}
